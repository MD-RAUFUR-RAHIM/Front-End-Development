<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variable</title>
    <style>
        :root{
            --primary-color: purple;
            --secondary-color: tomato;
            --font-size:20px;

        }
        h1{
            color: var(--primary-color);     
        }
        h5{
            background-color: var(--primary-color);
        }
        .box{
            border: 2px solid var(--primary-color);
            width: calc(100% - 300px);
        }
        .box p{
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <h1>
        My custom variables. 
    </h1>
    <h5> Aslo Commonly known as CSS variables</h5>
    <div class="box">
        <p>Lorem ipsum dolor sit amet, 
            consectetur adipisicing elit.
             Incidunt nam pariatur quos odit
              sit eum quaerat, natus unde 
              eligendi sequi. Provident sequi 
              aliquam totam aliquid!
               Aperiam quibusdam sequi quod ut</p>
    </div>
</body>
</html>
