<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container,
        .inner {
            width: 200px;
            height: 200px;

        }

        .container {
            border: 2px solid steelblue;
            background-color: aquamarine;
        }

        .inner {
            border: 2px solid brown;
            background-color: lightcoral;
            /* transform: scale(0.5); */
            transform: rotate(45deg);
            transform: scale(0.5) rotate(45deg) translate(50px);
        }

        .inner:hover {
            transform: scale(0.5) rotate(90deg) translate(-150px);
        }
    </style>
</head>

<body>
    <h2>Explore Transform and Translate</h2>
    <!-- .container*3{container $}>.inner{Inner} -->
    <div class="container">
        <div class="inner">Inner</div>
    </div>
    <div class="container">
        <div class="inner">Inner</div>
    </div>
    <div class="container">
        <div class="inner">Inner</div>
    </div>
</body>

</html>
