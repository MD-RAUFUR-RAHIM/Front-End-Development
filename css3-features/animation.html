<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        @keyframes ping-pong{
            from{
                left: 0;
            }
            to{
                left: 1250px;
                background-color: mediumseagreen;
            }
        }
        @keyframes bounce{
            0%{
                top: 0;
                left: 0;
            }
            25%{
                top: 200px;
                left: 300px;
            }
            50%{
                left: 700px;
                top: 0;
            }
            100%{
                top: 200px;
                left: 1200px;
            }
        }
        .stage{
            width: 1350px;
            height: 300px;
            background-color: lightgray;
            border: 2px solid steelblue;
        }
        .ball{
            width: 100px;
            height: 100px;
            background-color: tomato;
            border-radius: 50%;      
            position: relative;
            /* animation: ping-pong 2s ease-in-out 1s infinite alternate; */
            animation: bounce 2s ease-in-out 0s infinite alternate;
        }
    </style>
</head>
<body>
    <h2>Explore Animation</h2>
    <div class="stage">
        <div class="ball"></div>
    </div>
</body>
</html>
