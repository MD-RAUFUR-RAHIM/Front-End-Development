<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Basic CSS</title>
    <style>
        li{
            color: blue;
        }
        p{
            color: red;
            background-color: rgba(213, 208, 218, 0.719);
            width: 50%;
        }
        #short{
            color: green;
            text-align: center;
        }
        .player{
            color: yellow;
            background-color: blue;
            text-align: right;
        }
    </style>
</head>
<body>
    <h3 style="color:blueviolet">Learning Basic CSS</h3>
    <h4 style="background-color:aquamarine">Inline CSS</h4>
    <p>CSS meaning: Cascading Style Sheet</p>
    <p id="short">Style is colorful</p>
    <p>Short form is CSS</p>
    <p class="player">Needs style rule and value separated by colon</p>
    <p>after each styles you need to use semi-colon(:)</p>
    <ul>
        <li>Inline</li>
        <li>Internal</li> 
        <li>External</li>
    </ul>
</body>
</html>
