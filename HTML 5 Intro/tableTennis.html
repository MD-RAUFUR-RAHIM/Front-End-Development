<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tennis</title>
    <style>
        table{
            border: 1px solid #000;
        }
        td,th{
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <table>
        <caption>Tournament Schedule and Result</caption>
        <thead>
            <tr>
                <th>Round1</th>
                <th>Player A</th>
                <th>Player B</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Match 1</td>
                <td>John </td>
                <td>Alice</td>
            </tr>
            <tr>
                <td>Match 2</td>
                <td>Mark</td>
                <td>Sarah</td>
            </tr>
            <tr>
                <td><b>Round2</b></td>
                <th>Player C</th>
                <th>Player D</th>
            </tr>
            <tr>
                <td>Match 3</td>
                <td>TBD </td>
                <td>TBD</td>
            </tr>
            <tr>
                <td>Match 4</td>
                <td>TBD</td>
                <td>TBD</td>
            </tr>
            <tr>
                <th>Final</th>
                <th>Winner of Match 3</th>
                <th>Winner of Match 4</th>
            </tr>
            <tfoot>
                <td>Champion</td>
                <td>TBD</td>
                <td>TBD</td>
            </tfoot>
        </tbody>     
    </table>
</body>
</html>
