<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
    <style>
        table{
            width: 100%;
            border-collapse: collapse;
        }
        td,th{
            border: 1px solid #000;
        }
    </style>
    <link rel="stylesheet" href="styles/nav.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="video.html">Video</a></li>
                <li><a href="form.html">Form</a></li>
                <li>
                    <a href="table.html">Table</a>
                    <ul class="dropdown">
                        <li><a href="video.html">Video</a></li>
                        <li><a href="form.html">Form</a></li>
                        <li><a href="table.html">Table</a></li>
                        <li><a href="blog.html">Blog</a></li>
                    </ul>
                </li>
                <li><a href="blog.html">Blog</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>HTML Table </h1>
        <table>
            <caption>Employee Salary</caption>
            <thead>
                <tr>
                    <th>SL</th>
                    <th>Name</th>
                    <th>Company</th>
                    <th>Salary</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>John Doe</td>
                    <td>Microsoft</td>
                    <td> $1000</td>
                    </tr>
                <tr>
                    <td>2</td>
                    <td>Steve Jobs</td>
                    <td>Apple</td>
                    <td> $1000</td>
                    </tr>
                <tr>
                    <td>3</td>
                    <td>Elon Musk</td>
                    <td>Tesla</td>
                    <td> $1000</td>
                    </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4">Total= $3000</td>
                    
                </tr>
            </tfoot>
        </table>
    </main>
    
</body>
</html>
